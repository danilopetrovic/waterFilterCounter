<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Filter Tracking</title>
  <link rel="icon" type="image/svg+xml" href="water-icon2.svg">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Main content -->
  <main>
    <section class="hero">
      <h1>Water filtration tracking</h1>
    </section>
    <section>
      <p>
        <span id="result"></span> liters of water left for filtration.
      </p>
    </section>
    <div class="button-wrapper">
      <button id="custom">- Custom Value</button>
      <div id="custom-buttons" class="custom-buttons"></div>
      <button id="0.7">- 0.7 l</button>
      <button id="1.2">- 1.2 l</button>
      <button id="restart">Restart counter</button>
    </div>
    <article>
      <p>
        This small project was created by Petrovic Danilo.
        It is designed to track the usage counter for a water filtration system capable of filtering up to 100 liters of
        water.
      </p>
    </article>
  </main>

  <div id="custom-modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="custom-modal-title">
      <p id="custom-modal-title" class="modal-title">Enter custom value</p>
      <input id="custom-value" type="number" step="0.1" min="0.01" placeholder="0.7" />
      <div class="modal-actions">
        <button id="custom-confirm" class="primary">Confirm</button>
        <button id="custom-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
</body>

</html>
