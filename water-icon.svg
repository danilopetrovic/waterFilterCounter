<svg xmlns="http://www.w3.org/2000/svg"
     width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="waterGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6fd6ff"/>
      <stop offset="100%" stop-color="#0077c8"/>
    </linearGradient>
  </defs>

  <!-- Talas na samom dnu -->
  <path d="M8 60 C16 58 24 62 32 60 
           C40 58 48 62 56 60"
        stroke="#0077c8" stroke-width="3" fill="none"
        stroke-linecap="round"/>

  <!-- Kap vode: manja visina, centrirana, ~6px iznad talasa -->
  <path d="M32 10
           C22 26 20 36 20 44
           C20 50 25 54 32 54
           C39 54 44 50 44 44
           C44 36 42 26 32 10 Z"
        fill="url(#waterGradient)"/>

  <!-- Refleksija -->
  <path d="M28 26 C27 28 26.5 30 26.5 32
           C26.5 33.5 27 34.5 27.5 35"
        stroke="#ffffff" stroke-width="1.5" fill="none"
        stroke-linecap="round"/>
</svg>
